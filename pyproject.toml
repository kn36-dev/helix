[project]
name = "helix"
version = "0.1.0"
description = "High-Performance AI Systems Engineering Toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.0.0",
    "numpy>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.90.0",
]
profile = [
    "memray>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Ruff: Strict Linting and Formatting Strategy ---
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (design traps)
    "C90", # McCabe complexity
    "TCH", # flake8-type-checking (enforces type-only imports)
    "PL",  # Pylint rules
    "ASYNC" # flake8-async rules
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

# --- Mypy: Strict Static Type Checking ---
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

# --- Pytest & Benchmarking Configuration ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "benchmarks"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
pythonpath = ["src"]